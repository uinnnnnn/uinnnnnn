name: Waka Readme

on:
  schedule:
    - cron: '15 */12 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write # 確保 Action 有權限能把數據寫回你的 README
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # 這裡改用 GitHub 內建的預設權限 Token，不需要額外去設定
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
